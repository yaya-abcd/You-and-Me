<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予你之间</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="login-view" id="loginView" aria-label="登录">
      <div class="login-photos locked-gallery" aria-hidden="true">
        <div class="locked-photo"><span>ONLY US</span></div>
        <div class="locked-photo"><span>02.24</span></div>
        <div class="locked-photo"><span>X + Y</span></div>
      </div>

      <form class="login-panel" id="loginForm">
        <p class="eyebrow">ONLY US</p>
        <h1>予你之间</h1>
        <p class="login-line" id="loginModeText">选择账号，输入空间暗号进入你们的小空间</p>

        <div class="account-picker" id="accountPicker">
          <input class="account-radio" id="accountXuhan" type="radio" name="account" value="xuhan" checked>
          <label class="account-option" for="accountXuhan">
            <span>Xu Han</span>
            <small>xuhan</small>
          </label>
          <input class="account-radio" id="accountYuyang" type="radio" name="account" value="yuyang">
          <label class="account-option" for="accountYuyang">
            <span>Yu Yang</span>
            <small>yuyang</small>
          </label>
        </div>

        <label class="field">
          <span>空间暗号</span>
          <input id="passcodeInput" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="请输入空间暗号">
        </label>

        <p class="form-error" id="loginError" role="alert"></p>
        <button class="primary-button" id="loginSubmit" type="submit">进入空间</button>
      </form>
    </section>

    <main class="space-shell is-hidden" id="spaceShell">
      <aside class="side-panel">
        <div class="cover-stack">
          <div class="dynamic-cover-frame" data-cover-slot="0">
            <img class="cover-layer is-active" alt="">
            <img class="cover-layer" alt="">
          </div>
          <div class="dynamic-cover-frame" data-cover-slot="1">
            <img class="cover-layer is-active" alt="">
            <img class="cover-layer" alt="">
          </div>
          <div class="dynamic-cover-frame" data-cover-slot="2">
            <img class="cover-layer is-active" alt="">
            <img class="cover-layer" alt="">
          </div>
        </div>

        <section class="counter-panel" aria-label="空间概览">
          <div>
            <strong id="dayCount">0</strong>
            <span>天</span>
          </div>
          <p>在一起的日子</p>
        </section>

        <section class="quick-stats" aria-label="记录数量">
          <div>
            <span id="messageCount">0</span>
            <small>心里话</small>
          </div>
          <div>
            <span id="postCount">0</span>
            <small>日常</small>
          </div>
          <div>
            <span id="wishCount">0</span>
            <small>愿望</small>
          </div>
        </section>
      </aside>

      <section class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="activeAccountLabel">XUHAN</p>
            <h2>我们的私密空间</h2>
          </div>
          <div class="top-actions">
            <button class="ghost-button" type="button" id="logoutButton">切换</button>
          </div>
        </header>

        <nav class="tabbar" aria-label="空间导航">
          <button class="tab-button is-active" type="button" data-view="chatView">心里话</button>
          <button class="tab-button" type="button" data-view="dailyView">日常</button>
          <button class="tab-button" type="button" data-view="albumView">相册</button>
          <button class="tab-button" type="button" data-view="wishView">愿望</button>
        </nav>

        <section class="view-panel is-active" id="chatView">
          <div class="section-head">
            <div>
              <p class="eyebrow">WHISPER</p>
              <h3>想说的话</h3>
            </div>
            <button class="soft-button" type="button" id="clearVoiceButton">清除语音</button>
          </div>

          <div class="message-list" id="messageList" aria-live="polite"></div>

          <form class="chat-composer" id="chatForm">
            <textarea id="messageInput" rows="3" maxlength="800" placeholder="写一句只想给对方看的话"></textarea>
            <div class="voice-preview is-hidden" id="voicePreviewWrap">
              <audio id="voicePreview" controls></audio>
            </div>
            <div class="composer-actions">
              <button class="ghost-button" type="button" id="recordButton">录音</button>
              <button class="ghost-button" type="button" id="stopRecordButton" disabled>停止</button>
              <button class="primary-button" type="submit">发送</button>
            </div>
          </form>
        </section>

        <section class="view-panel" id="dailyView">
          <div class="section-head">
            <div>
              <p class="eyebrow">DAILY</p>
              <h3>今天也要留下来</h3>
            </div>
          </div>

          <form class="daily-form" id="dailyForm">
            <div class="daily-grid">
              <label class="field">
                <span>标题</span>
                <input id="postTitle" type="text" maxlength="60" placeholder="今天的小标题">
              </label>
              <label class="field">
                <span>心情</span>
                <select id="postMood">
                  <option value="甜">甜</option>
                  <option value="想念">想念</option>
                  <option value="开心">开心</option>
                  <option value="认真">认真</option>
                  <option value="抱抱">抱抱</option>
                </select>
              </label>
            </div>
            <label class="field">
              <span>内容</span>
              <textarea id="postBody" rows="4" maxlength="1200" placeholder="照片、碎碎念、今天发生的事"></textarea>
            </label>
            <label class="upload-box" for="postAttachment">
              <input id="postAttachment" type="file" accept="image/*,audio/*,video/*">
              <span id="attachmentLabel">添加照片、音频或视频</span>
            </label>
            <button class="primary-button" type="submit">保存日常</button>
          </form>

          <div class="post-list" id="postList"></div>
        </section>

        <section class="view-panel" id="albumView">
          <div class="section-head">
            <div>
              <p class="eyebrow">ALBUM</p>
              <h3>相册</h3>
            </div>
          </div>
          <div class="album-grid" id="albumGrid"></div>
        </section>

        <section class="view-panel" id="wishView">
          <div class="section-head">
            <div>
              <p class="eyebrow">WISHES</p>
              <h3>一起完成的事</h3>
            </div>
          </div>

          <div class="anniversary-note">
            <span>我们的纪念日</span>
            <strong>2026年2月24日</strong>
          </div>

          <form class="wish-form" id="wishForm">
            <input id="wishInput" type="text" maxlength="120" placeholder="想一起做什么">
            <button class="primary-button" type="submit">加入愿望</button>
          </form>

          <div class="wish-list" id="wishList"></div>
        </section>
      </section>
    </main>

    <dialog class="photo-dialog" id="photoDialog">
      <button class="dialog-close" type="button" id="closePhotoDialog" aria-label="关闭">×</button>
      <img id="dialogImage" alt="照片预览">
      <p id="dialogCaption"></p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="config.js?v=1"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
